name: Dependency audit

# Reports `npm audit` to the Mako portal, split production vs full scope.
#
# WHY: the portal reads GitHub's Dependabot alerts, which never see dev-only
# transitive findings — that is how a real advisory sat unseen on a repo
# showing "0 alerts". The portal has no checkout and cannot run npm audit
# itself, so the repo runs it and reports in.
#
# The split matters: a production finding is exposure, a dev-only finding is
# hygiene. Reporting one number for both is how the real one gets ignored.
#
# HARDENED 2026-09-28. The portal rebuilt on 2026-08-24 had no
# /api/master/audit, so every report was redirected to its sign-in page,
# which answers 200 — 25 repos ran green for five weeks while reporting
# nothing. Three things now make that impossible to miss:
#  1. The report refuses redirects, and only the portal's own JSON receipt
#     ({ ok: true }) counts as delivered.
#  2. A missing PORTAL_INGEST_SECRET fails the run instead of skipping.
#  3. The last step fails on any high or critical finding, so the audit is a
#     signal on its own (GitHub emails a failed scheduled run) rather than
#     depending entirely on the portal to notice.

on:
  schedule:
    - cron: "20 6 * * 1" # Mondays, before the fleet's working week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `npm ci` on purpose: `npm audit` reads the lockfile, and a repo
      # whose install is broken is exactly the one whose audit must still be
      # reported rather than skipped.
      - name: Audit production scope
        id: prod
        run: |
          npm audit --omit=dev --json > prod.json 2>/dev/null || true
          echo "ok=$( [ -s prod.json ] && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      - name: Audit full scope
        run: npm audit --json > dev.json 2>/dev/null || true

      - name: Report to the portal
        env:
          PORTAL_URL: https://portal.makoai.studio
          PORTAL_INGEST_SECRET: ${{ secrets.PORTAL_INGEST_SECRET }}
        run: |
          if [ -z "$PORTAL_INGEST_SECRET" ]; then
            echo "::error::PORTAL_INGEST_SECRET is not set, so this audit cannot reach the portal. Set it from MASTER_INGEST_SECRET in makoai-portal/.env.local."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const read = (f) => {
              try { return JSON.parse(fs.readFileSync(f, "utf8")); }
              catch { return null; }
            };
            const sev = (j) => {
              const v = j && j.metadata && j.metadata.vulnerabilities;
              return v
                ? { critical: v.critical|0, high: v.high|0, moderate: v.moderate|0, low: v.low|0 }
                : null;
            };
            const prodJson = read("prod.json");
            const devJson = read("dev.json");
            const prod = sev(prodJson);
            const dev = sev(devJson);

            // Advisories the repo has deliberately parked. dependabot.yml
            // carries the reason beside each ignore, so a known-and-accepted
            // finding is reported as parked rather than as a new problem.
            let parked = [];
            try {
              const yml = fs.readFileSync(".github/dependabot.yml", "utf8");
              // Real ignore entries only, never comment lines: a comment
              // mentioning dependency-name was being reported as a package.
              const names = [...yml.matchAll(/^[ \t]*-?[ \t]*dependency-name:[ \t]*"?([^"\s#]+)/gm)]
                .map((m) => m[1]);
              parked = [...new Set(names)]
                .map((name) => ({ package: name, reason: "ignored in dependabot.yml" }));
            } catch {}

            const findings = [];
            const vulns = (devJson && devJson.vulnerabilities) || {};
            for (const [name, v] of Object.entries(vulns)) {
              if (v && (v.severity === "critical" || v.severity === "high")) {
                findings.push({
                  package: name,
                  severity: v.severity,
                  via: Array.isArray(v.via)
                    ? v.via.map((x) => (typeof x === "string" ? x : x.title)).filter(Boolean).join("; ").slice(0, 300)
                    : "",
                });
              }
            }

            const body = {
              repo: process.env.GITHUB_REPOSITORY,
              ref: process.env.GITHUB_REF_NAME,
              commit_sha: process.env.GITHUB_SHA,
              prod: prod || undefined,
              dev: dev || undefined,
              parked,
              top_findings: findings,
              // UNKNOWN IS NOT ZERO. If npm audit could not produce a
              // report, say so — never let a failed audit read as a clean one.
              audit_error: (!prod || !dev)
                ? "npm audit did not produce a parseable report (missing or broken lockfile?)"
                : undefined,
            };

            fetch(process.env.PORTAL_URL + "/api/master/audit", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                authorization: "Bearer " + process.env.PORTAL_INGEST_SECRET,
              },
              body: JSON.stringify(body),
              // A redirect means the route is gone or auth bounced us to the
              // sign-in page. Following it turns that into a fake 200.
              redirect: "manual",
            })
              .then(async (r) => {
                const text = await r.text();
                console.log("portal responded", r.status, text.slice(0, 500));
                // Only a receipt from the collector itself ({ ok: true })
                // counts: not a page that merely loaded, not some other JSON.
                // (No apostrophes in this script: it is single-quoted.)
                let receipt = null;
                try { receipt = JSON.parse(text); } catch {}
                if (!r.ok || !receipt || receipt.ok !== true) {
                  console.error("::error::The portal did not confirm the audit report, so nobody has it.");
                  process.exit(1);
                }
              })
              .catch((e) => { console.error(e); process.exit(1); });
          '

      # The audit's own verdict, independent of whether the portal heard it.
      - name: Fail on high or critical
        if: always()
        run: npm audit --audit-level=high
